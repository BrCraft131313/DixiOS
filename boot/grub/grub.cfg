set timeout=5
set default=0
set gfxpayload=text

menuentry "DixiOS GNU/Linux" {
    search --no-floppy --fs-uuid --set=root 4E21-0000
    linux /boot/kernel.bin root=PARTUUID="Your PARTUUID" rootdelay=5 rw rootwait init=/UserSpace/bin/DixiOSInit earlyprintk=vga,keep vga=normal nomodeset debug ignore_loglevel
}
